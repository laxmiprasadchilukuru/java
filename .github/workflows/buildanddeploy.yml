name: build and deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: setup java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: java and maven version
        run: |
          java -version
          mvn -version

      - name: build with maven
        run: mvn clean package

      - name: verify jar file
        run: |
          ls -l target/*.jar
          echo "build and deploy workflow completed successfully."

      - name: prepare EBS package
        run: |
          mkdir -p EB-deployment
          cp target/*.jar EB-deployment/
          echo "web: java -jar *.jar" > EB-deployment/Procfile
          ls -la EB-deployment

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-deployment
          path: EB-deployment

  terraform:
    name: terraform infra
    runs-on: ubuntu-latest
    needs: aws_build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: gharole

      - name: Test AWS CLI
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.0.0

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

  Deploy:
    name: deploy to EBS
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          name: streamflix-deployment
          path: deployment

      - name: verify deployment files
        run: |
          echo "verifying deployment files..."
          ls -la deployment
          echo "procfile content"
          cat deployment/Procfile
          test -f deployment/Procfile && echo "procfile exists"
          test -f deployment/*.jar && echo "jar file exists"

      - name: create deployment zip
        run: |
          cd deployment
          zip -r ../streamflixdeployment.zip .
          cd ..
          unzip -l streamflixdeployment.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: gharole

      - name: Test OIDC Authentication
        run: |
          aws sts get-caller-identity

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/elastic-beanstalk-deploy@v1
        with:
          application-name: streamflix
          environment-name: dev
          version-label: streamflix-${{ github.run_number }}
          region: us-east-1
          deployment-package: streamflixdeployment.zip