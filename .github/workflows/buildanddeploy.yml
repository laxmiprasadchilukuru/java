name: build and deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: streamflix-deployment
  cancel-in-progress: false

jobs:
  aws_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: setup java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: java and maven version
        run: |
          java -version
          mvn -version

      - name: build with maven
        run: mvn clean package

      - name: verify jar file
        run: |
          ls -l target/*.jar
          echo "build and deploy workflow completed successfully."

      - name: prepare EBS package
        run: |
          mkdir -p EB-deployment
          jars=(target/*.jar)
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" EB-deployment/application.jar
          echo "web: java -jar application.jar" > EB-deployment/Procfile
          ls -la EB-deployment

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-deployment
          path: EB-deployment

  terraform:
    name: terraform infra
    runs-on: ubuntu-latest
    needs: aws_build
    outputs:
      application_name: ${{ steps.tf_outputs.outputs.application_name }}
      environment_name: ${{ steps.tf_outputs.outputs.environment_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: gharole

      - name: Test AWS CLI
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -input=false tfplan

      - name: Export Terraform outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "application_name=$(terraform output -raw elastic_beanstalk_application_name)" >> "$GITHUB_OUTPUT"
          echo "environment_name=$(terraform output -raw elastic_beanstalk_environment_name)" >> "$GITHUB_OUTPUT"

  Deploy:
    name: deploy to EBS
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          name: streamflix-deployment
          path: deployment

      - name: verify deployment files
        run: |
          echo "verifying deployment files..."
          ls -la deployment
          echo "procfile content"
          cat deployment/Procfile
          test -f deployment/Procfile && echo "procfile exists"
          test -f deployment/application.jar && echo "jar file exists"

      - name: create deployment zip
        run: |
          cd deployment
          zip -r ../streamflixdeployment.zip .
          cd ..
          unzip -l streamflixdeployment.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: gharole

      - name: Test OIDC Authentication
        run: |
          aws sts get-caller-identity

      - name: Deploy to Elastic Beanstalk
        env:
          EB_APPLICATION: ${{ needs.terraform.outputs.application_name }}
          EB_ENVIRONMENT: ${{ needs.terraform.outputs.environment_name }}
          VERSION_LABEL: streamflix-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BUCKET=$(aws elasticbeanstalk create-storage-location --query S3Bucket --output text)
          KEY="$EB_APPLICATION/$VERSION_LABEL.zip"
          aws s3 cp streamflixdeployment.zip "s3://$BUCKET/$KEY"
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION_LABEL" \
            --source-bundle "S3Bucket=$BUCKET,S3Key=$KEY"
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$VERSION_LABEL"
          aws elasticbeanstalk wait environment-updated \
            --environment-names "$EB_ENVIRONMENT"
