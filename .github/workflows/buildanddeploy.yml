name: build and deploy
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  aws_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: setup java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: java and maven version
        run: |
          java -version
          mvn -version
      - name: build with maven
        run: mvn clean package
      - name: verify jar file
        run: |
          ls -l target/*.jar
          echo "build and deploy workflow completed successfully."
      - name: prepare EBS package
        run: |
          mkdir -p EB-deployment
          cp target/*.jar EB-deployment/
          echo "web: java -jar *.jar" > EB-deployment/Procfile
          ls -la EB-deployment
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-deployment
          path: EB-deployment